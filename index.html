<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>procuct inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center text-primary">PRODUCT INVENTORY</h1>
        
        <!-- inevntory -->
         <input type="text" id="editstatus" hidden>
<form id="product">
    <div class="row my-4">
        <div class="col-lg-2">
            <input id="proid" type="number" placeholder="product id" class="form-control" required>
        </div>
        <div class="col-lg-2">
            <input id="proname" type="text" placeholder="product name" class="form-control" required>
        </div>
        <div class="col-lg-2">
            <input id="price" type="number" placeholder="product price" class="form-control" required>
        </div>
        <div class="col-lg-2">
            <input id="qntity" type="number" placeholder="product Quantity" class="form-control" required>
        </div>
        <div class="col-lg-2">
            <button type="submit" class="btn btn-success w-100" >Add product</button>
        </div>
    </div>
</form>

<table class="my-5 table table-bordered table-hover">
    <thead class="table-dark text-light text-center">
        <tr>
            <th>Product Id</th>
            <th>Product name</th>
            <th>Price</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody id="tablebody"></tbody>
</table>

    </div>
    <script src="main.js"></script>
</body>
</html>
